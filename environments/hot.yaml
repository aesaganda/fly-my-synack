name: hot
description: >
  Dry air at 35C - PAST the fly's thermal optimum, not simply a warmer version
  of it. Ectotherm locomotor performance rises with temperature to an optimum
  around 25-30C and then declines toward the critical thermal maximum. Here the
  Q10 speed-up outruns the body: the network commands a ~29 Hz stride that the
  legs cannot track, so the fly is the most ACTIVE preset by instantaneous leg
  speed and among the least effective by distance covered. Frantic, not fast.
units: mm_g_s

physics:
  density: 1.146e-6      # dry air @35C
  viscosity: 1.89e-5     # air viscosity RISES with temperature
  wind: [0.0, 0.0, 0.0]
  gravity: [0.0, 0.0, -9810.0]
  integrator: Euler

neural:
  # Drosophila are ectotherms: neural kinetics track ambient T. At 35 C the
  # membrane time constants are ~2.3x shorter than at 25 C, which drives the
  # leg motor pools to ~123 Hz against ~70 Hz at 25 C - faster than the muscle
  # can usefully follow. See MAX_FORWARD_DRIVE in bridge/decode.py.
  temperature_c: 35.0
  q10: 2.3               # PLACEHOLDER
  tau_clamp_ms: [2.0, 120.0]

sensory:
  mechanosensory_gain: 1.0
  johnstons_organ_gain: 1.0
  # Volatility rises with temperature, so there is more odorant in the air
  # at 35 C than at 25 C. PLACEHOLDER magnitude.
  olfactory_gain: 1.15
