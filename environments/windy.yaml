name: windy
description: >
  Dry air at 25C with a steady 1.5 m/s wind - strong enough to shove the fly about. NOTE: MuJoCo's `wind` is
  subtracted from body velocity and the resulting force scales with density and
  viscosity - so wind with zero density would be a silent no-op. Density is
  nonzero here on purpose.
units: mm_g_s

physics:
  density: 1.184e-6
  viscosity: 1.84e-5
  # 1.5 m/s along +x, in mm/s. Strong enough to visibly shove the fly around:
  # it stays on its feet and keeps walking, but the path bends hard (measured
  # straightness 0.75 against 0.997 in still air) and it is pushed downwind.
  #
  # There is a cliff just above this. Measured with the current gait:
  #     <= 1.9 m/s  stays grounded, ~2.6 feet down, |roll| under 17 deg
  #        2.0 m/s  lifted ~12 mm off the floor and tumbles, blown 1.2 m downwind
  #        3.0 m/s  swept away at ~1.6 m/s, gone
  # 1.5 leaves margin below that. Raise it if you want to study being blown
  # over rather than walking in wind.
  #
  # An earlier version of this preset sat at 0.15 m/s because the gait then was
  # fragile enough to capsize at 0.25. The gait is much steadier now, so the
  # wind no longer has to be a whisper.
  wind: [1500.0, 0.0, 0.0]
  gravity: [0.0, 0.0, -9810.0]
  integrator: Euler

neural:
  temperature_c: 25.0
  q10: 2.3               # PLACEHOLDER
  tau_clamp_ms: [2.0, 40.0]

sensory:
  # PLACEHOLDER. Johnston's organ is the fly's wind/air-motion detector, so it
  # is the input most plausibly boosted here.
  mechanosensory_gain: 1.1
  johnstons_organ_gain: 1.5
